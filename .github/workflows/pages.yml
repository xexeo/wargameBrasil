name: Publicar Monte Castelo Vibed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar jogo standalone
        run: |
          mkdir -p public
          cp jogo.html public/index.html
          cp LICENSE public/LICENSE
          mkdir -p public/ux
          cp docs/paletas-ux.svg docs/paletas-ux.html docs/PALETAS_UX.md public/ux/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
