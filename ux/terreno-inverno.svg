<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="white"/><g font-family="Arial,sans-serif" fill="#20262D"><text x="30" y="42" font-size="26" font-weight="bold">Monte Castelo · proposta de terreno de inverno</text><text x="30" y="73" font-size="16">Estudo visual. Opção no popup Aparência; não é restituição histórica.</text><text x="30" y="115" font-size="18" font-weight="bold">Base de altitude: luminosidade ordenada + cotas e curvas</text><rect x="30" y="132" width="225" height="65" fill="#ECE6D8" stroke="#52606A"/><text x="45" y="160" font-size="18" font-weight="bold">N1</text><text x="45" y="183" font-size="14">#ECE6D8</text><rect x="270" y="132" width="225" height="65" fill="#D6CCB9" stroke="#52606A"/><text x="285" y="160" font-size="18" font-weight="bold">N2</text><text x="285" y="183" font-size="14">#D6CCB9</text><rect x="510" y="132" width="225" height="65" fill="#C2B6A3" stroke="#52606A"/><text x="525" y="160" font-size="18" font-weight="bold">N3</text><text x="525" y="183" font-size="14">#C2B6A3</text><rect x="750" y="132" width="225" height="65" fill="#AFA99E" stroke="#52606A"/><text x="765" y="160" font-size="18" font-weight="bold">N4</text><text x="765" y="183" font-size="14">#AFA99E</text><text x="30" y="235" font-size="18" font-weight="bold">Materiais: usar pequenas manchas e texturas, preservando a altitude</text><rect x="30" y="255" width="85" height="60" rx="4" fill="#C4B58A" stroke="#52606A"/><text x="130" y="275" font-size="17" font-weight="bold">Campo dormente · #C4B58A</text><text x="130" y="299" font-size="14">Proposta gráfica de inverno</text><rect x="510" y="255" width="85" height="60" rx="4" fill="#9E8973" stroke="#52606A"/><text x="610" y="275" font-size="17" font-weight="bold">Terra exposta · #9E8973</text><text x="610" y="299" font-size="14">Localização histórica não mapeada</text><rect x="30" y="340" width="85" height="60" rx="4" fill="#A0A09A" stroke="#52606A"/><text x="130" y="360" font-size="17" font-weight="bold">Pedra · #A0A09A</text><text x="130" y="384" font-size="14">Não atribuir a todos os cumes</text><rect x="510" y="340" width="85" height="60" rx="4" fill="#59614F" stroke="#52606A"/><text x="610" y="360" font-size="17" font-weight="bold">Bosque dessaturado · #59614F</text><text x="610" y="384" font-size="14">Composição de espécies não confirmada</text><rect x="30" y="425" width="85" height="60" rx="4" fill="#76685D" stroke="#52606A"/><text x="130" y="445" font-size="17" font-weight="bold">Lama localizada · #76685D</text><text x="130" y="469" font-size="14">Condição a confirmar por fonte</text><rect x="510" y="425" width="85" height="60" rx="4" fill="#ECEFEB" stroke="#52606A"/><text x="610" y="445" font-size="17" font-weight="bold">Neve acumulada · #ECEFEB</text><text x="610" y="469" font-size="14">Presença/distribuição a confirmar</text><text x="30" y="548" font-size="16" font-weight="bold">21/02/1945: manhã fria e abertura do céu na reanálise regional.</text><text x="30" y="575" font-size="15">Sem neve nova modelada no dia; a neve no solo permanece desconhecida.</text><text x="30" y="601" font-size="15">Frio não comprova lama, solo seco ou congelamento. Não criar penalidades a partir da cor.</text><text x="30" y="630" font-size="13" fill="#52606A">Fontes e limites: docs/TEMPO_21_FEVEREIRO_1945.md e docs/PALETAS_UX.md · 25/10/2026</text></g></svg>